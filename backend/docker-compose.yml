services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: carpool
      POSTGRES_USER: carpool
      POSTGRES_PASSWORD: carpool_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - carpool_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carpool -d carpool"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  carpool_postgres:
